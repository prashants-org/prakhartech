name: Production Deploy

on:
  push:
    branches: [main] # Triggered automatically when Dev merges to Main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      # 1. Build: Vite client + SSR bundle, then prerender every route to static HTML
      - name: Build Project
        run: npm run build
        env:
          # Optional analytics. Set ONE as a repository variable (Settings → Secrets and variables → Actions → Variables).
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}

      # 2. Upload Artifacts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist # Ensure this matches your build output folder

      # 3. Deploy
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
